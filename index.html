<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puppeteer — Dungeon Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HUD: minimal crosshair, only visible once the player has entered the game -->
  <div id="crosshair" class="hidden">+</div>
  <!-- Debug overlay: live telemetry readout, toggle with T. On by default
     while building — hide it before recording the final demo. -->
  <div id="debug-overlay"></div>
  <!-- Narrative subtitle: shows Granite-generated lines, faded in/out.
     Triggered by director.js at hunt start, hunt end, and periodic
     ambient/tension check-ins. Empty and invisible until shown. -->
  <div id="narrative-subtitle"></div>

  <!-- Start overlay: click to lock the mouse and begin -->
  <div id="start-overlay">
    <div class="start-box">
      <h1>Puppeteer</h1>
      <p class="tagline">The dungeon is watching you back.</p>
      <p class="instructions">
        Click to begin<br />
        <span>WASD to move &middot; Mouse to look &middot; ESC to release cursor</span>
      </p>
    </div>
  </div>

  <!-- Three.js core (r128, UMD build — no build step required) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Our game code, order matters: game sets up the scene, controls handles input, main runs the loop -->
  <script src="js/game.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/enemy.js"></script>
  <!-- npc.js after enemy.js (shares rig pattern); before director.js and
       narrativeUI.js (calls showNarrativeLine and reads telemetry/director state,
       but neither director.js nor narrativeUI.js depends on npc.js being loaded first) -->
  <script src="js/npc.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/director.js"></script>
  <script src="js/narrativeUI.js"></script>
  <!-- audio.js after director.js (calls startHunt/endHunt hooks it extends)
       and before main.js (main.js calls initAudio() on the overlay click) -->
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
